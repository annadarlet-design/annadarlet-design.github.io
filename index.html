  /* слово рядом, её шрифтом, как «КУПИТЬ» на бирке, — маленькое (её слово: «совсем не крупно») */

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- Холст: размеры от Игоря (столяр), 1 октября 2026 ----------
// Палочки МДФ, скос 45°, наклеены на лист с акварелью; бумага работает как петли.
// Каждая пара шире предыдущей на 11 мм = 10 мм МДФ + бумага и зазор → МДФ 10 мм.
// ПОСЛЕДНЯЯ ПАЛОЧКА — 76, А НЕ 86 (Анныч, 2 октября: «конечную планку ты увеличиваешь»).
// Игорь дал начало ряда — «20+20+31+31+42+42+53+53…», — пару 86, 86 я достроил сам, и зря.
// Квадратная спираль: торец рулона задают две последние палочки. При 86 и 86 он 86 × 86,
// а её обмер — 87 × 77. Значит, последняя закрывает виток не целиком: 76 мм + бумага = 77.
// Фото картины это подтверждает: последний шов от края в 230 точках, а не в 255, как у 86.
const W_MM = [20, 20, 31, 31, 42, 42, 53, 53, 64, 64, 75, 75, 86, 76];
// Швы между палочками (2100 = вся ширина). С 5 окт фото картины выпрямлено по каждой палочке отдельно,
// поэтому швы стоят ровно на границах палочек: 20, 40, 71 … 656 мм из 732.
const SEAMS = [57.4, 114.8, 203.7, 292.6, 413.1, 533.6, 685.7, 837.7, 1021.3, 1204.9, 1420.1, 1635.2, 1882.0];
const N = W_MM.length;
const T = 0.010;                 // толщина МДФ
const PAPER = 0.0005;            // бумага Fabriano
const HP = 0.520;                // 520 мм — обмер Анныч 2 окт (торец рулона 87 × 77, длина 520)
const X = [0]; W_MM.forEach(w => X.push(X[X.length - 1] + w / 1000));
const WP = X[N];                 // 0,732 м (было 0,742 — с лишними 10 мм последней палочки)
const U = [0, ...SEAMS.map(p => p / 2100), 1];
const X0 = -WP / 2;              // левый край раскрытой картины в мире
const CLIP_IN = 0.043;           // зажимы в 43 мм от краёв (середина крайней палочки)
const ROPE_R = 0.0023;           // шпагат 4,6 мм — по руке Анны
const SAG = 0.032;
// ---------- Цепь подвеса: нитка → кольцо → проушина → тело зажима → зубцы → работа ----------
// Высоту задают не диаметры, а ДВА КАСАНИЯ: нитка лежит на внутреннем верху кольца,
// проушина висит на внутреннем низу того же кольца. Всё ниже посчитано из них, а не на глаз.
// Анныч 2 окт: «если что-то не так, увеличь размер прищепки». Увеличено в 1,35 раза —
// тело 34 мм вместо 25, кольцо 40 вместо 30: на телефоне 25 мм против работы 742 мм
// это десяток точек, механизма в них не разглядеть.
const K_CLIP = 1.35;
const Z_H = 0.025 * K_CLIP, Z_PIVOT = 0.007 * K_CLIP, Z_JAW = 0.018 * K_CLIP, Z_T = 0.0007 * K_CLIP;
const RING_R = 0.0145 * K_CLIP, RING_W = 0.0018 * K_CLIP;   // кольцо 40 мм из проволоки 2,4 мм
const RING_H = RING_R - RING_W / 2;              // радиус отверстия 13,6 мм
const EYE_R = 0.0022 * K_CLIP, EYE_W = 0.0009 * K_CLIP;     // проушина: кольцо проходит свободно
const DROP_RR = RING_H - ROPE_R;                 // 11,3 мм: центр кольца ниже оси нитки
// Поправка Кодекса 2 окт: на внутреннем низу кольца лежит ВЕРХНЯЯ ПРОВОЛОКА проушины,
// а её центр ещё на радиус проушины ниже. Моё прежнее 13,15 было неверно.
const DROP_RE = RING_H - EYE_W / 2 + EYE_R;      // 15,05 мм: центр проушины ниже центра кольца
const HANG_PEG = DROP_RR + DROP_RE;              // 26,35 мм — на столько проушина ниже оси нитки
const EYE_UP = Z_PIVOT + EYE_R;                  // проушина выше начала тела (оси створок)
// Насколько зубцы заходят на лист — не на вкус, а из геометрии губок. Створки расходятся
// клином от оси: просвет между ними равен толщине листа РОВНО на кончиках зубцов, а выше
// клин уже. Значит толстый край глубже кончиков просто не входит: зажим держит самую кромку.
const BITE = 0.0015;

// ---------- ЗАЖИМ-БУЛЬДОГ: его прислала Анныч 3 октября, с ним и работаем ----------
// Её фотографии — Hunt Mfg. Co. / X-Acto, сталь. Главное на них обведено красным с ДВУХ
// сторон трубки: НИТКА ИДЁТ СКВОЗЬ ТРУБКУ. Значит ни кольца, ни проушины, ни цепи подвеса
// больше нет вовсе — зажим сидит на нитке сам, своей трубкой, по ней же ездит и качается.
// Это проще всего, что у нас было, и держит крепче: трубка и есть пружина.
//
// ЧИСЛА И ОТКУДА ОНИ.
//   · ширина 51 мм — ходовой «двухдюймовый» бульдог (каталоги: 2" = 50–51 мм);
//   · заявленная хватка таких зажимов 0,5" = 12,7 мм. Наш край — бумага плюс МДФ, 10,5 мм:
//     входит с запасом. Ровно этого запаса и не было у латунной прищепки;
//   · трубка наружу 10 мм, сталь 0,5 → просвет 9 мм. Шпагат 4,6 мм проходит свободно,
//     с зазором 2,2 мм — это и есть вся высота подвеса, считать больше нечего.
// Имена ниже остались от биндера (BN_), чтобы не переписывать пол-страницы: теперь они
// про бульдог.
//
// Старое про биндер — на случай, если придётся возвращаться: пружиной был верхний сгиб,
// грани — её плечи, губка 7 мм висела на своём сгибе; висел он ручкой в латунном кольце.
// Решение Анныч 2 октября 2026. Старые латунные прищепки держать 2,9 кг не могут:
// губке нужен прижим 24 Н, торсионная пружина даёт 2–4 Н. Разрыв в шесть-десять раз,
// зубцами он не закрывается. Прищепки остаются бумаге — акварель 150 г их работа,
// и на этой же нитке они висят по сторонам кадра. Холст висит на двух биндерах 51 мм:
// рычажная пружина из стальной ленты даёт 30–60 Н, трение при μ = 0,3 — 18–36 Н на два.
// Обмер типового 51 мм (каталоги поставщиков): губки 51 мм, тело 22–25 мм,
// прижимная полоса 7 мм, зев на стопку 25 мм, проволока ручки 1,4 мм.
const SHEET = T + PAPER;                            // край работы: МДФ 10 мм и бумага
const BN_W = 0.051;                                 // 51 мм вдоль края — двухдюймовый бульдог
const BN_ST = 0.0005;                               // сталь 0,5 мм
const BN_RO = 0.0050, BN_RI = BN_RO - BN_ST;        // трубка: 10 мм снаружи, просвет 9 мм
const BN_H = 0.017;                                 // от оси трубки до кончиков губок
const BN_JAW = 0.006;                               // прижимная полоса у кончика, вдоль работы
const BN_CAP = 0.0127;                              // заявленная хватка 0,5" — предел зева
const BN_WR = 0.0007;                               // проволока ушка 1,4 мм
const BN_EYE = 0.0052;                              // ушко: радиус по средней линии проволоки
const BN_HINGE = BN_H - BN_JAW;                     // 11 мм: от оси трубки до сгиба губки
const BN_ZJ = BN_ST / 2;                            // сомкнутые губки касаются лицом к лицу: зазор ноль
// ПРИЖИМ. Губка не висит над краем и не сидит в нём: она на него ДАВИТ, и под 30–60 Н
// бумага с кромкой МДФ подминаются на доли миллиметра. В счёте это 0,3 мм — именно
// на столько зев шире самого края. Ноль здесь ставить нельзя: тогда губка и работа
// лежат в одной плоскости, и любое дрожание числа читается как врезание.
const BD_CLR = 0.0003;
const BN_BULGE = BN_ZJ;                             // у сгиба губки пластина уже на средней плоскости
// Зев открывается КЛИНОМ ОТ ОСИ ТРУБКИ: пластина поворачивается вокруг неё, и точка в L от оси
// уходит от средней плоскости на L·sin θ. Губка при этом остаётся ПАРАЛЛЕЛЬНОЙ работе.
// В жизни это не поворот жёсткой пластины, а её ПРОГИБ: трубка-пружина давит, пластина выгибается,
// и прижимает бульдог всей зубчатой кромкой, а не одной точкой на кончике.
const bnGapAt = th => 2 * (BN_HINGE * Math.sin(th) + BN_BULGE * Math.cos(th) + BN_ZJ - BN_BULGE - BN_ST / 2);
function bnThetaFor(d) {                            // обратная задача — решаем, а не угадываем
  let lo = 0, hi = 1.0;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (bnGapAt(m) < d) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
// (бульдог отставлен 2 октября; его числа выше оставлены, он строится функциями ниже)

// ---------- ДЕРЕВЯННАЯ ПРИЩЕПКА ДЛЯ ТОЛСТЫХ РАБОТ: её фото, 2 октября 2026 ----------

function rng(seed) {
  let s = seed >>> 0;

    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function tileNoise(size, periods, seed, gain = 0.55) {
  const r = rng(seed), h = new Float32Array(size * size);
  let amp = 1, tot = 0;
  for (const P of periods) {
    const lat = new Float32Array(P * P).map(() => r());
    for (let y = 0; y < size; y++) {
      const fy = y / size * P, y0 = Math.floor(fy), ty = fy - y0, sy = ty * ty * (3 - 2 * ty);
      const r0 = (y0 % P) * P, r1 = ((y0 + 1) % P) * P;
      for (let x = 0; x < size; x++) {
        const fx = x / size * P, x0 = Math.floor(fx), tx = fx - x0, sx = tx * tx * (3 - 2 * tx);
        const c0 = x0 % P, c1 = (x0 + 1) % P;
        const a = lat[r0 + c0] + (lat[r0 + c1] - lat[r0 + c0]) * sx;
        const b = lat[r1 + c0] + (lat[r1 + c1] - lat[r1 + c0]) * sx;

}

  const d = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const xl = h[y * size + (x - 1 + size) % size], xr = h[y * size + (x + 1) % size];
    const yu = h[((y - 1 + size) % size) * size + x], yd = h[((y + 1) % size) * size + x];
    let nx = (xl - xr) * strength, ny = (yd - yu) * strength, nz = 1;
    const l = Math.sqrt(nx * nx + ny * ny + 1); nx /= l; ny /= l; nz /= l;
    const i = (y * size + x) * 4;
    d[i] = (nx * .5 + .5) * 255; d[i + 1] = (ny * .5 + .5) * 255; d[i + 2] = (nz * .5 + .5) * 255; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, size, size);

  t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

  const g = c.getContext('2d', { willReadFrequently: true }); g.fillStyle = base; g.fillRect(0, 0, s, s);

  for (let i = 0; i < s * s; i++) { const k = (n[i] - .5) * tint;
    img.data[i * 4] += k; img.data[i * 4 + 1] += k * .9; img.data[i * 4 + 2] += k * .75; }

  const tri = (a, b, c, n, ua, ub, uc) => {

  const quad = (a, b, c, d, n, ua, ub, uc, ud) => { tri(a, b, c, n, ua, ub, uc); tri(a, c, d, n, ua, uc, ud); };

  begin(0);   // лицо — картина

       [U[i], 0], [U[i + 1], 0], [U[i + 1], 1], [U[i], 1]);

  quad(top(fl), top(fr), top(bR), top(bL), [0, 1, 0], cu(fl), cu(fr), cu(bR), cu(bL));

    const c = P[i][Math.min(j + 1, NV)], d = P[i][Math.max(j - 1, 0)];
    const u = [a[0] - b[0], a[1] - b[1], a[2] - b[2]], v = [c[0] - d[0], c[1] - d[1], c[2] - d[2]];
    let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const L = Math.hypot(...n) || 1;              // наружу: на пластине +z, на клюве вниз
    Nm[i].push(n.map(q => q / L));
  }
  const pos = [], nor = [], uvs = [];
  const add = (p, n, u) => { pos.push(p[0], p[1], p[2]); nor.push(n[0], n[1], n[2]); uvs.push(u[0], u[1]); };
  const off = (p, n, d) => [p[0] + n[0] * d, p[1] + n[1] * d, p[2] + n[2] * d];
  // гладкие поверхности: изнанка и лицо
  for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) {
    const Q = [[i, j], [i, j + 1], [i + 1, j + 1], [i + 1, j]];
    const inn = Q.map(([a, b]) => [off(P[a][b], Nm[a][b], CHAM), Nm[a][b].map(q => -q), [b / NV, a / NU]]);
    const out = Q.map(([a, b]) => [off(P[a][b], Nm[a][b], Z_T - CHAM), Nm[a][b], [b / NV, a / NU]]);
    // обход треугольников согласован с нормалью (её отзыв 8 окт про ушки): прежде он был обратным,
    // и вместо лица рисовалась изнанка, вывернутая к зрителю, — пластина отражала комнату за собой
    // и выходила бледной, чужой рядом с ушком
    for (const [x, y, z] of [[0, 1, 2], [0, 2, 3]]) { add(...inn[x]); add(...inn[y]); add(...inn[z]); }
    for (const [x, y, z] of [[0, 2, 1], [0, 3, 2]]) { add(...out[x]); add(...out[y]); add(...out[z]); }
  }
  // торцы: своя сетка, плоские нормали, посередине фаска
  const band = (p0, n0, p1, n1, e0, e1) => {
    const mk = (p, n, e) => [off(off(p, n, Z_T / 2), e, CHAM * 1.4), off(p, n, CHAM), off(p, n, Z_T - CHAM)];
    const A = mk(p0, n0, e0), B = mk(p1, n1, e1);
    const quad = (a, b, c, d) => {
      const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [d[0] - a[0], d[1] - a[1], d[2] - a[2]];
      let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const L = Math.hypot(...n) || 1; n = n.map(q => q / L);
      add(a, n, [0, 0]); add(b, n, [1, 0]); add(c, n, [1, 1]);
      add(a, n, [0, 0]); add(c, n, [1, 1]); add(d, n, [0, 1]);
    };
    quad(A[1], B[1], B[0], A[0]); quad(A[0], B[0], B[2], A[2]);
  };
  const edge = (i, j, di, dj) => {            // наружу из кромки, в плоскости листа
    const p = P[i][j], qd = P[Math.min(Math.max(i + di, 0), NU)][Math.min(Math.max(j + dj, 0), NV)];
    const e = [p[0] - qd[0], p[1] - qd[1], p[2] - qd[2]], L = Math.hypot(...e) || 1;
    return e.map(v => v / L);
  };
  for (let i = 0; i < NU; i++) {
    band(P[i][0], Nm[i][0], P[i + 1][0], Nm[i + 1][0], edge(i, 0, 0, 1), edge(i + 1, 0, 0, 1));
    band(P[i + 1][NV], Nm[i + 1][NV], P[i][NV], Nm[i][NV], edge(i + 1, NV, 0, -1), edge(i, NV, 0, -1));
  }
  for (let j = 0; j < NV; j++) {
    // верхнего торца нет: там лист не кончается, а переходит в ушко (washerGeometry)
    band(P[NU][j], Nm[NU][j], P[NU][j + 1], Nm[NU][j + 1], edge(NU, j, -1, 0), edge(NU, j + 1, -1, 0));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  return g;
}

// ПРУЖИНА — не украшение, а то, чем зажим держит. Торсионная, из стальной проволоки 0,6 мм.
// Её отзыв 8 окт: «пружина — непонятно, что случилось». Прежде у каждой губки была своя
// половина пружины: губки расходились — и половинки расходились тоже, выходили звенья цепи.
// Теперь как у настоящей: на концах оси по два с лишним витка, они СТОЯТ на оси. От каждого
// витка две ноги: передняя вверх в зазор и в изнанку передней губки, задняя — в изнанку
// задней. Ноги поворачиваются вместе со своей губкой вокруг той же оси, на которой витки,
// поэтому от витка не отрываются. Ноги распирают верхушки — значит зубцы сомкнуты.
const SPR_R = 0.0011 * K_CLIP, SPR_W = 0.00045 * K_CLIP;   // радиус витка 1,5 мм, проволока 0,6
const SPR_X = () => zWidth(T_PIV) + 0.0009;       // первый виток — за кромкой губок у оси
const SPR_A = 0.6, SPR_SWEEP = 4 * Math.PI + 2 * SPR_A, SPR_LEN = SPR_W * 1.1 * SPR_SWEEP / (2 * Math.PI);
const sprPt = (sx, u) => { const a = SPR_A - u * SPR_SWEEP;     // u: 0 — передний конец, 1 — задний
  return new THREE.Vector3(sx * (SPR_X() + u * SPR_LEN), SPR_R * Math.cos(a), SPR_R * Math.sin(a)); };
function springCoils() {
  const tube = sx => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(
    Array.from({ length: 49 }, (_, i) => sprPt(sx, i / 48))), 96, SPR_W / 2, 7, false);
  return mergeGeos([tube(-1), tube(1)]);
}
// нога к губке side (+1 передняя): от конца витка вверх за кромкой губки, потом внутрь,
// прижатая к изнанке губки на высоте 5,5 мм над осью
function springLegs(side) {
  const yC = Z_PIVOT * 0.58, tC = (Z_PIVOT - yC) / Z_H;
  const zIn = zSpine(tC) + CHAM - SPR_W / 2 - 0.00003;      // касание изнанки, без зазора на глаз
  const legs = [-1, 1].map(sx => {
    const p0 = sprPt(sx, side > 0 ? 0 : 1), x0 = Math.abs(p0.x);
    const pts = [p0, new THREE.Vector3(sx * x0, SPR_R * 1.9, side * (SPR_R * 0.75)),
                 new THREE.Vector3(sx * x0, yC, side * zIn), new THREE.Vector3(sx * x0 * 0.45, yC + 0.0004, side * zIn)];
    return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'centripetal'), 40, SPR_W / 2, 7, false);
  });
  return mergeGeos(legs);
}
// УШКО (её отзыв 8 окт: «маленькое колечко, которое должно держать две губки и касаться
// основного кольца, — ерунда»). Было отдельное тонкое колечко над прищепкой, меньше, чем
// считала цепь подвеса, и на палочке-шейке — висело само по себе. На фото с аукциона иначе:
// верх КАЖДОЙ губки вытянут в плоскую шайбу с дыркой, и большое кольцо продето сквозь обе.
// Шайба — та же латунь, что губка, и продолжает её верх. Верхний край дырки — ровно там, где
// цепь подвеса ждёт касание кольца; шайбы стоят по сторонам от середины кольца, где низ кольца
// уже загибается вверх, — на столько они и подняты (lift, 0,5 мм).
const WASH_HOLE = 0.0018, WASH_R = WASH_HOLE + 0.0016;      // дырка 3,6 мм (проволока кольца 2,4), шайба 6,8 мм
const WASH_Z = Z_GAP / 2 + Z_T / 2;                         // середина толщины губки на её верхнем краю
const WASH_LIFT = RING_H - Math.sqrt(RING_H * RING_H - WASH_Z * WASH_Z);
const WASH_CY = EYE_UP + (EYE_R - EYE_W / 2) + WASH_LIFT - WASH_HOLE;   // центр шайбы, от оси губок
function washerGeometry() {
  // шейка — во всю ширину верха пластины и той же толщины: стык не виден, деталь одна
  const wN = zWidth(0), cy = WASH_CY - Z_PIVOT, R = WASH_R;  // от верхнего края пластины
  const a0 = Math.asin(wN / R);                              // где шейка входит в круг
  const sh = new THREE.Shape(); sh.moveTo(-wN, 0); sh.lineTo(wN, 0);
  sh.lineTo(wN, cy - R * Math.cos(a0));
  sh.absarc(0, cy, R, -Math.PI / 2 + a0, 3 * Math.PI / 2 - a0, false);
  sh.lineTo(-wN, 0);
  const hole = new THREE.Path(); hole.absarc(0, cy, WASH_HOLE, 0, Math.PI * 2, true); sh.holes.push(hole);
  const d = Z_T - 2 * CHAM;                                   // как у пластины: лицо и изнанка там же
  const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: false, curveSegments: 48 });
  g.translate(0, Z_PIVOT, WASH_Z - d / 2);
  // нижний торец шейки убран: здесь шейка срастается с губкой, торец между ними светился полоской-порожком
  { const P0 = g.attributes.position, keep = [];
    for (let t = 0; t < P0.count; t += 3) {
      let low = 0; for (let q = 0; q < 3; q++) if (Math.abs(P0.getY(t + q) - Z_PIVOT) < 1e-7) low++;
      if (low < 3) keep.push(t);
    }
    for (const name of Object.keys(g.attributes)) {
      const A = g.attributes[name], n = A.itemSize, out = new Float32Array(keep.length * 3 * n);
      keep.forEach((t, m) => out.set(A.array.subarray(t * n, (t + 3) * n), m * 3 * n));
      g.setAttribute(name, new THREE.BufferAttribute(out, n));
    }
    g.clearGroups(); }
  // UV — как у губки: шайба берёт ту же патину, не растянутую
  const P = g.attributes.position, uv = g.attributes.uv;
  // масштаб тот же, что у губки (u = x / ширина, v = путь / L1 · 40/72) — иначе налёт на ушке вдвое крупнее
  for (let i = 0; i < P.count; i++) uv.setXY(i, P.getX(i) / (2 * wN) + 0.5, (Z_PIVOT - P.getY(i)) / (Z_H - LIP_RF) * 40 / 72);
  // Лицо и изнанка чуть выпуклые, как у штампованной шайбы: совсем плоская латунь смотрит в одну
  // точку комнаты — в тёмную сторону снимающего — и выходила тёмным пятном с чертой на стыке.
  // Наклон нормали растёт от шейки (там ровно, как у пластины) к краю круга.
  const N = g.attributes.normal, cyW = WASH_CY;
  for (let i = 0; i < P.count; i++) {
    const nz = N.getZ(i); if (Math.abs(nz) < 0.9) continue;      // торцы не трогаем
    const dx = P.getX(i), dy = P.getY(i) - cyW, r = Math.hypot(dx, dy) / WASH_R;
    const k = 0.32 * Math.min(1, r) * sstep(Z_PIVOT, Z_PIVOT + 0.0015, P.getY(i));
    const n = new THREE.Vector3(dx / (r * WASH_R || 1) * k, dy / (r * WASH_R || 1) * k, Math.sign(nz)).normalize();
    N.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}

// Старая латунь: потёртая, с прозеленью; где налёт гуще — там и глуше.
const patina = (() => {
  const S = 256, h = tileNoise(S, [3, 7, 19, 48], 7731, 0.62);
  const rough = new Uint8Array(S * S * 4), col = new Uint8Array(S * S * 4);
  for (let i = 0; i < S * S; i++) {
    const v = THREE.MathUtils.clamp((h[i] - 0.38) * 2.2, 0, 1);
    rough[i * 4] = 255; rough[i * 4 + 1] = (0.24 + 0.34 * v) * 255; rough[i * 4 + 2] = 255; rough[i * 4 + 3] = 255;
    col[i * 4] = (0.93 - 0.14 * v) * 255; col[i * 4 + 1] = (0.78 - 0.09 * v) * 255;
    col[i * 4 + 2] = (0.44 + 0.02 * v) * 255; col[i * 4 + 3] = 255;
  }
  const mk = d => { const t = new THREE.DataTexture(d, S, S); t.wrapS = t.wrapT = THREE.RepeatWrapping;
                    t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter;
                    t.anisotropy = maxAniso; t.needsUpdate = true; return t; };
  const c = mk(col); c.colorSpace = THREE.SRGBColorSpace;
  return { rough: mk(rough), col: c, nrm: normalMap(tileNoise(S, [9, 23, 60], 991, 0.5), S, 1.6) };
})();

const brass = new THREE.MeshPhysicalMaterial({ map: patina.col, metalness: 1, roughness: 1,
  roughnessMap: patina.rough, normalMap: patina.nrm, normalScale: new THREE.Vector2(0.4, 0.4) });
const brassOld = new THREE.MeshPhysicalMaterial({ map: patina.col, color: '#d8ceba', metalness: 1,
  roughness: 1, roughnessMap: patina.rough, normalMap: patina.nrm, normalScale: new THREE.Vector2(0.5, 0.5) });
const steel = new THREE.MeshStandardMaterial({ color: '#9a958c', metalness: 1, roughness: .34 });

const GEO = { leaf: null, leafB: null, pin: null, cap: null, wash: null, ring: null, coils: null, legF: null, legB: null };
function clipGeometries() {
  if (GEO.leaf) return;
  GEO.leaf = leafGeometry(0); GEO.leafB = leafGeometry(0.5);       // задняя — со сдвигом на ползубца
  const pinHalf = SPR_X() + SPR_LEN + SPR_W;
  GEO.pin = new THREE.CylinderGeometry(0.00085, 0.00085, pinHalf * 2, 14).rotateZ(Math.PI / 2);   // ось, на концах — витки
  GEO.cap = new THREE.SphereGeometry(0.0012, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2).scale(1, 0.45, 1)
    .rotateZ(-Math.PI / 2).translate(pinHalf, 0, 0);                     // расклёпанная головка оси
  GEO.wash = washerGeometry();
  // Кольцо разрезное, из гнутой проволоки: без разрыва поворот кольца не виден вовсе.
  GEO.ring = new THREE.TorusGeometry(RING_R, RING_W / 2, 10, 72, Math.PI * 1.93).rotateY(Math.PI / 2);
  GEO.ringEnd = new THREE.SphereGeometry(RING_W / 2, 10, 8);
  GEO.coils = springCoils(); GEO.legF = springLegs(1); GEO.legB = springLegs(-1);
}

// Один зажим. root → кольцо на нитке → шайбы губок на кольце → две губки вокруг оси.
// open(θ) разводит губки на ±θ: зубцы расходятся на 2·18·sin θ мм.
function makeClip(hue = 0) {
  clipGeometries();
  // Начало координат зажима — точка, где цепь подвеса ждёт ушко: им он и висит на кольце.
  const root = new THREE.Group();
  const ring = new THREE.Group(); root.add(ring);                        // место кольца считается каждый кадр
  ring.add(new THREE.Mesh(GEO.ring, brassOld));
  for (const a of [0, Math.PI * 1.93]) {                                 // концы разреза закруглены
    const e = new THREE.Mesh(GEO.ringEnd, brassOld);                     // кольцо повёрнуто rotateY(90°):
    e.position.set(0, RING_R * Math.sin(a), -RING_R * Math.cos(a));      // окружность легла как (0, R·sin, −R·cos)
    ring.add(e);
  }
  const body = new THREE.Group(); body.position.y = -EYE_UP; root.add(body);
  const eye = new THREE.Object3D(); eye.position.y = EYE_UP; body.add(eye);   // метка ушка — по ней щуп колец
  body.add(new THREE.Mesh(GEO.pin, steel), new THREE.Mesh(GEO.coils, steel));
  for (const sx of [1, -1]) { const c = new THREE.Mesh(GEO.cap, steel); c.scale.x = sx; body.add(c); }
  const leaves = [];
  for (const s of [1, -1]) {
    const L = new THREE.Group(); body.add(L); leaves.push(L);
    const sh = new THREE.Mesh(s > 0 ? GEO.leaf : GEO.leafB, brass), w = new THREE.Mesh(GEO.wash, brass);
    if (s < 0) { sh.scale.z = -1; w.scale.z = -1; }                     // задняя губка — зеркало
    L.add(sh, w, new THREE.Mesh(s > 0 ? GEO.legF : GEO.legB, steel));
    L.userData.s = s;
  }
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  root.userData = {
    ring, body, leaves,
    open(th) {                                                           // th — поворот каждой створки
      const t = THREE.MathUtils.clamp(th, 0, Z_TMAX);
      leaves[0].rotation.x = -t; leaves[1].rotation.x = t;
    },
    // просвет между кончиками зубцов, м
    gap() { return 2 * Z_JAW * Math.sin(Math.abs(leaves[0].rotation.x)); }
  };
  root.userData.open(0);
  return root;
}
// Угол, при котором в губки входит вещь толщиной d
const thetaFor = d => Math.asin(THREE.MathUtils.clamp(d / (2 * Z_JAW), 0, Math.sin(Z_TMAX)));

// ---------- Биндер: как он сделан ----------
// Золото — не латунь: гальваника по стали, ровнее и холоднее старой прищепки, но та же
// приглушённость (её слово про латунь: «старая, приглушённая»). Карта шероховатости от
// патины оставлена: без неё металл выходит зеркальной игрушкой.
const gold = new THREE.MeshPhysicalMaterial({ color: '#c0983c', metalness: 1, roughness: 0.30,
  roughnessMap: patina.rough, normalMap: patina.nrm, normalScale: new THREE.Vector2(0.14, 0.14) });
const goldWire = new THREE.MeshPhysicalMaterial({ color: '#cfa94f', metalness: 1, roughness: 0.20,
  normalMap: patina.nrm, normalScale: new THREE.Vector2(0.09, 0.09) });
const holeDark = new THREE.MeshStandardMaterial({ color: '#2a2521', metalness: 0.6, roughness: 0.7 });
// Пластина — лист 0,5 мм. Видна с обеих сторон (снаружи и из зева), и обход треугольников
// у такой тонкой детали легко перепутать: один раз перепутал — и зажим вышел тёмной коробкой,
// потому что в кадр смотрела изнанка. Двусторонний материал снимает этот вопрос совсем.
const goldSheet = gold.clone(); goldSheet.side = THREE.DoubleSide;
// И шероховатее: отвесная зеркальная пластина отражает то, что ПОД ней, а под ней у нас
// пусто — от этого она выходила тёмной коробкой. Приглушённый металл берёт рассеянный свет.
goldSheet.roughness = 0.46;

// ПЛАСТИНА БУЛЬДОГА. Силуэт с её фотографии: круглая трубка сверху, под ней ТРЕУГОЛЬНИК
// из двух пластин, сходящихся к нижней кромке. Пластина выходит из трубки по касательной
// примерно на её «четыре часа» и идёт прямо к сгибу губки; дальше губка — прямая полоса
// вдоль работы. Нижняя кромка ВОЛНИСТАЯ: это не украшение, а зубья — ими бульдог и держит,
// потому что пластина под нагрузкой выгибается и ложится на край именно кромкой.
const BD_SC_N = 9, BD_SC_D = 0.0011;                 // девять волн, глубина 1,1 мм
const BD_TAN = Math.SQRT1_2;                         // пластина сходит с трубки под 45°
// ГУБКА — ОТДЕЛЬНАЯ ДЕТАЛЬ НА СВОЁМ СГИБЕ, а не продолжение пластины. Пластина разводится
// клином от трубки, а губка при этом остаётся ПАРАЛЛЕЛЬНОЙ работе — потому бульдог
// и прижимает всей зубчатой кромкой, а не одной точкой. Сначала я сделал пластину одним
// куском: кончик уезжал наружу на 8,4 мм, а у сгиба оставалось 0,24 мм просвета — щуп
// тут же поймал врезание. Правда в том, что это две детали, и считать их надо порознь.
// Профиль: часть «face» идёт от трубки к сгибу губки, часть «lip» — от сгиба к кончику.
// Обе строятся одной машинкой, вторая — в системе самого сгиба, чтобы её можно было
// отворачивать назад ровно на угол раскрытия.
function bdPartGeometry(sg, lip) {
  const C = lip ? 36 : 6, P = [], Nm = [], tris = [];
  const half = BN_W / 2, h = BN_ST / 2;
  const mid = lip ? [[0, 0], [-BN_JAW, 0]]
                  : [[-BN_RO * BD_TAN, BN_RO * BD_TAN], [-BN_HINGE, BN_ZJ + BD_CLR]];

    // двумя опорами ходит вбок вся сразу, треугольником от груза к концам: прищепка в метре

function onMode(m) {

    // сгибов приравнивались нулю, а рисовались они по другой формуле — выгиб повёрнутой работы.
    // Два скачка в одном кадре: лист распрямлялся мгновенно и тут же выгибался заново.
    // Теперь угол никуда не прыгает: запоминаем, КАК СТОЯЛ лист в последнем кадре,
    // и за 0,45 с переводим его в новую форму — рука разглаживает, а не подменяет.
    for (let j = 0; j < J; j++) qSnap[j] = phi[j];

      loose.y = show.y; loose.dy = show.dy;

    show.chi = 0; show.dchi = 0.02; show.y = loose.y; show.dy = loose.dy;   // рука отпустила — лёгкий качок

function toggle() {

  await post(`/frame?n=0&set=${params.get('set') || 's'}`, canvas.toDataURL('image/png'));
  document.title = `ГОТОВО ${ms | 0} мс`;
}

// кружок касания для ролика: где он на экране, какой величины, насколько виден и нажат ли
const TAP_PT = new THREE.Vector3(0.70, -0.33, 0.002);     // на лице бруска, в координатах листа
const GRAB_PT = new THREE.Vector3(0.102, -0.465, 0.002);  // у нижнего угла висящего боком холста
function circleAt(t, tapAt, turnAt) {
  // кружок один и тот же: появляется у самого касания, исчезает сразу, как рука отпустила
  const sm = (a, b, x) => { const u = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
  let pt = null, alpha = 0, press = 0;
  if (t > tapAt - 0.16 && t < tapAt + 0.24) {
    pt = TAP_PT; alpha = sm(tapAt - 0.16, tapAt - 0.03, t) * (1 - sm(tapAt + 0.12, tapAt + 0.22, t));
    press = sm(tapAt - 0.05, tapAt, t) * (1 - sm(tapAt + 0.08, tapAt + 0.14, t));
  } else if (turnAt > 0 && t > turnAt - 0.16 && t < turnAt + TURN_DUR + 0.16) {
    pt = GRAB_PT; alpha = sm(turnAt - 0.16, turnAt - 0.03, t) * (1 - sm(turnAt + TURN_DUR + 0.03, turnAt + TURN_DUR + 0.13, t));
    press = sm(turnAt - 0.05, turnAt, t) * (1 - sm(turnAt + TURN_DUR, turnAt + TURN_DUR + 0.06, t));
  }
  if (!pt || alpha <= 0) return { x: 0, y: 0, alpha: 0, press: 0 };
  const w = pt.clone().applyMatrix4(holst.matrix).project(cam);
  const W = renderer.domElement.width, H = renderer.domElement.height;
  return { x: +((w.x * .5 + .5) * W).toFixed(1), y: +((-w.y * .5 + .5) * H).toFixed(1), alpha: +alpha.toFixed(3), press: +press.toFixed(3) };
}

// съёмка кадров: ?capture&w=1080&h=1920&fps=30&dur=4.6&tap=0.5&turn=2.3&set=a[&acc=64]
function snap() {
  return { q: Float64Array.from(q), ha: hand.a, hc: hand.chi0, ht: hand.t0, hy: hand.y, hz: hand.z, hp: hand.p, sc: show.chi, sy: show.y, ly: loose.y, mode, clock,
           htx: hand.tx, hty: hand.ty, uc: sun.chi, uk: sun.ky, up: sun.phase, xc: [...X_C], rp: Float32Array.from(rollPhi), pm: phiMix, st: scroll.tilt, su: scroll.u, kt: scroll.kt, rz: rside.z };
}
function restore(s) {
  q.set(s.q); hand.a = s.ha; hand.chi0 = s.hc; hand.t0 = s.ht; hand.y = s.hy; hand.z = s.hz; hand.p = s.hp;
  show.chi = s.sc; show.y = s.sy; loose.y = s.ly; mode = s.mode; clock = s.clock;
  hand.tx = s.htx; hand.ty = s.hty; sun.chi = s.uc; sun.ky = s.uk; sun.phase = s.up;
  s.xc.forEach((v, k) => { X_C[k] = v; }); rollPhi.set(s.rp); phiMix = s.pm; scroll.tilt = s.st; scroll.u = s.su; scroll.kt = s.kt; rside.z = s.rz ?? rside.z;
}

// кружок «солнышка»: где рука касается холста — толчки, поимка наверху, свиток
const _cp = new THREE.Vector3();
function sunCircle(t) {
  const sm = (a, b, x) => { const u = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
  const c = sun.contacts.find(c => t >= c.from && t < c.to + 0.12);
  if (!c) return { x: 0, y: 0, alpha: 0, press: 0 };
  let i = 2, x = 0.055, y = -HP * 0.5;
  const mid = k => (X[k] + X[k + 1]) / 2;
  if (c.kind === 'hold') { i = 1; x = 0.030; }
  else if (c.kind === 'lpush' || c.kind === 'flip') { i = 7; x = mid(7); y = -HP * 0.80; }   // ладонь на нижней половине листа
  else if (c.kind === 'calm') { i = 0; x = 0.012; }                                       // нижний край стоя
  else if (c.kind === 'rehang') { i = N - 2; x = mid(N - 2); }
  else if (c.kind === 'edge') {                                                          // край свитка, где рука
    const xx = Math.max(0.006, WP - curS() + 0.008);
    i = 0; while (i < N - 1 && X[i + 1] <= xx) i++; x = Math.min(xx, X[i + 1] - 0.002);
  }
  else if (c.kind === 'unscroll') {
    if (scroll.kt < 0.65) { i = 1; x = 0.034; }
    else { const hu = X[N - 2] * scroll.u; i = 0; while (i < N - 1 && X[i + 1] <= hu) i++; x = Math.min(X[i] + 0.004, X[i + 1]); }
  }
  else if (c.kind === 'catch') { i = 6; x = (X[6] + X[7]) / 2; }
  else if (c.kind === 'scroll') {
    const hu = X[N - 2] * scroll.u;
    if (t - c.from < 0.65) { i = 1; x = 0.034; }
    else { i = 0; while (i < N - 1 && X[i + 1] <= hu) i++; x = Math.min(X[i] + 0.004, X[i + 1]); }
  }
  _cp.set(x, y, 0.002).applyMatrix4(strips[i].matrix).applyMatrix4(holst.matrix).project(cam);
  const W = renderer.domElement.width, H = renderer.domElement.height;
  const alpha = sm(c.from, c.from + 0.08, t) * (1 - sm(c.to + 0.02, c.to + 0.12, t));
  const press = sm(c.from, c.from + 0.04, t) * (1 - sm(c.to, c.to + 0.05, t));
  return { x: +((_cp.x * .5 + .5) * W).toFixed(1), y: +((-_cp.y * .5 + .5) * H).toFixed(1), alpha: +alpha.toFixed(3), press: +press.toFixed(3) };
}
// съёмка петли: ?loop&capture&w=720&h=1280&fps=30&acc=24&set=<новое имя>
async function captureLoop() {
  const fps = +params.get('fps') || 30, set = params.get('set') || 'loop', maxDur = +(params.get('dur') || 60);
  // &from=&to= — снять только кадры [from, to): счёт идёт весь, рисуются только свои. Так петлю
  // снимают несколько браузеров сразу, каждый свой кусок, и куски сходятся кадр в кадр.
  const kFrom = +(params.get('from') || 0), kTo = +(params.get('to') || 1e9);
  captureSize();
  if (ACC) setupAcc(renderer.domElement.width, renderer.domElement.height);
  loopInit(); placeCamera(10);
  const sub = Math.ceil(480 / fps), shutter = 0.5, meta = [], t0 = performance.now(), c0 = clock;
  for (let k = 0; k < maxDur * fps && lp.phase !== 'done'; k++) {
    const shots = [];
    if (k > 0) for (let s = 0; s < sub; s++) { step(1 / fps / sub); shots.push(snap()); }
    else shots.push(snap());
    const mine = k >= kFrom && k < kTo;
    if (!mine) { pose(); reflexStep(); placeCamera(1 / fps); }
    else if (ACC) {
      pose(); placeCamera(1 / fps); reflStep(true);
      const fin = snap();
      drawAccumulated(ACC, f => { restore(shots[Math.min(shots.length - 1, Math.floor(f * shutter * shots.length))]); pose(); reflexStep(); placeCamera(0); });
      restore(fin); pose(); reflexStep(); placeCamera(0);
    } else { pose(); reflexStep(); placeCamera(1 / fps); draw(); }
    meta.push({ k, t: +(clock - c0).toFixed(3), mode, phase: lp.phase, ...sunCircle(clock) });
    document.title = `кадр ${k + 1}, ${((performance.now() - t0) / (k + 1) / 1000).toFixed(1)} с/кадр, ${lp.phase}`;
    if (mine) await post(`/frame?n=${k}&set=${set}`, canvas.toDataURL(params.has('png') ? 'image/png' : 'image/jpeg', 0.95));
  }
  if (kFrom === 0) await post(`/meta?set=${set}`, JSON.stringify({ fps, frames: meta, events }, null, 0));
  document.title = 'ГОТОВО ' + meta.length;
}
// съёмка «солнышка»: ?sun&capture&w=720&h=1280&fps=30&acc=24&set=s1
async function captureSun() {
  const fps = +params.get('fps') || 30, set = params.get('set') || 'sun';
  const sunAt = +(params.get('sun_at') ?? 0.8), showHold = +(params.get('show_hold') ?? 1.6), tail = +(params.get('tail') ?? 2.4);
  const maxDur = +(params.get('dur') || 22);
  captureSize();
  if (ACC) setupAcc(renderer.domElement.width, renderer.domElement.height);
  X_C[0] = -XC_UP; X_C[1] = XC_UP;
  window.__holst.setState('hanging');
  clock = 0; modeT = 0;
  const sub = Math.ceil(480 / fps), shutter = 0.5, meta = [];
  let started = false, scrolled = false, shownAt = -1;
  const t0 = performance.now();
  for (let k = 0; k < maxDur * fps; k++) {
    const t = k / fps;
    if (!started && t >= sunAt) { startSun(); started = true; }
    if (mode === 'shown' && !scrolled) { if (shownAt < 0) shownAt = t; if (t - shownAt >= showHold) { startScroll(); scrolled = true; } }
    if (scroll.released && clock - scroll.tr > tail) break;
    const shots = [];
    for (let s = 0; s < sub; s++) { step(1 / fps / sub); shots.push(snap()); }
    if (ACC) {
      pose(); placeCamera(1 / fps); reflStep(true);
      const fin = snap();
      drawAccumulated(ACC, f => { restore(shots[Math.min(sub - 1, Math.floor(f * shutter * sub))]); pose(); reflexStep(); placeCamera(0); });
      restore(fin); pose(); reflexStep(); placeCamera(0);
    } else { pose(); reflexStep(); placeCamera(1 / fps); draw(); }
    meta.push({ k, t: +t.toFixed(3), mode, phase: mode === 'sun' ? sun.phase : '', chi: +(view3.chi || 0).toFixed(3), ...sunCircle(clock) });
    document.title = `кадр ${k + 1}, ${((performance.now() - t0) / (k + 1) / 1000).toFixed(1)} с/кадр, ${mode} ${sun.phase}`;
    await post(`/frame?n=${k}&set=${set}`, canvas.toDataURL('image/png'));
  }
  await post(`/meta?set=${set}`, JSON.stringify({ fps, frames: meta, events }, null, 0));
  document.title = 'ГОТОВО ' + meta.length;
}
async function capture() {
  const fps = +params.get('fps') || 30, set = params.get('set') || 'a';
  const dur = +params.get('dur') || 4.6, tapAt = +(params.get('tap') ?? 0.5), turnAt = +(params.get('turn') ?? 2.3);
  captureSize();
  if (ACC) setupAcc(renderer.domElement.width, renderer.domElement.height);
  window.__holst.setState('rolled');
  clock = 0; modeT = 0; camMove.t0 = -10;
  const n = Math.round(dur * fps), sub = Math.ceil(480 / fps), shutter = 0.5, meta = [];
  let tapped = false, turned = false;
  const t0 = performance.now();
  for (let k = 0; k < n; k++) {
    const t = k / fps;
    // КАК ЭТО ДЕЛАЕТ РУКА, так и снимаем. Прежде здесь стоял один toggle() — он толкал брусок,
    // но ремешки-то застёгнуты, и холст честно оставался рулоном все семь секунд.
    // Порядок настоящий: расстегнуть → потянуть вниз → повесить → повернуть.
    if (!tapped && t >= tapAt) { unbelt(); toggle(); tapped = true; }
    const pullFrom = tapAt + 0.45, pullTo = Math.max(pullFrom + 0.9, (turnAt > 0 ? turnAt : dur) - 0.75);
    if (t >= pullFrom && t <= pullTo) {
      const u = (t - pullFrom) / (pullTo - pullFrom);
      held = true; sTarget = S_MIN + (S_MAX - S_MIN) * easeIO(u);        // рука ведёт край вниз
    } else if (held && t > pullTo) { held = false; }
    if (!turned && turnAt > 0 && t >= turnAt) { held = false; if (mode === 'dropping') setMode('hanging'); toggle(); turned = true; }
    const shots = [];
    for (let s = 0; s < sub; s++) { step(1 / fps / sub); shots.push(snap()); }
    if (ACC) {
      // камера шагает раз на кадр (прежде при накоплении она стояла на месте весь кусок — Кодекс)
      pose(); placeCamera(1 / fps); reflStep(true);
      const fin = snap();
      drawAccumulated(ACC, f => { restore(shots[Math.min(sub - 1, Math.floor(f * shutter * sub))]); pose(); reflexStep(); placeCamera(0); });
      restore(fin); pose(); reflexStep(); placeCamera(0);
    } else { pose(); reflexStep(); placeCamera(1 / fps); draw(); }
    const cn = new THREE.Vector3(-WP / 2, -HP + ropeLoad, 0).project(cam), cw = renderer.domElement.width, chh = renderer.domElement.height;
    meta.push({ k, t: +t.toFixed(3), mode, ...circleAt(t, tapAt, turnAt),
                lx: +((cn.x * .5 + .5) * cw).toFixed(1), ly: +((-cn.y * .5 + .5) * chh).toFixed(1) });
    document.title = `кадр ${k + 1}/${n}, ${((performance.now() - t0) / (k + 1) / 1000).toFixed(1)} с/кадр`;
    // toDataURL — сразу, без ожидания перерисовки: скрытая вкладка иначе стоит по секундам
    await post(`/frame?n=${k}&set=${set}`, canvas.toDataURL('image/png'));
  }
  await post(`/meta?set=${set}`, JSON.stringify({ fps, frames: meta, events }, null, 0));
  document.title = 'ГОТОВО ' + n;
}

ready.then(() => {
  tm('всё загружено'); veilOff().catch(() => document.getElementById('veil')?.remove());
  if (params.has('still')) { still().catch(e => { document.title = 'ОШИБКА ' + e.message; console.error(e); }); return; }
  if (CAPTURE && LOOP) { captureLoop().catch(e => { document.title = 'ОШИБКА ' + e.message; console.error(e); }); return; }
  if (LOOP) { loopInit(); resize(); pose(); placeCamera(10); requestAnimationFrame(t => { last = t; frame(t); }); return; }
  if (CAPTURE && SUN) { captureSun().catch(e => { document.title = 'ОШИБКА ' + e.message; console.error(e); }); return; }
  if (CAPTURE) { capture().catch(e => { document.title = 'ОШИБКА ' + e.message; console.error(e); }); return; }
  window.__holst.setState('rolled');
  resize(); pose(); placeCamera(1); reflStep(true); requestAnimationFrame(t => { last = t; frame(t); });
  window.__frame = frame;                         // проверка в скрытой вкладке: кадры вручную (rAF там спит)
});
// АВТОСЪЁМКА ВИДЕО (15 окт): ?autocap=<адрес приёмника> — страница, когда всё выросло, сама гонит петлю (?vid=) 20 с
// для разгона (растения и нитка входят в ритм), потом снимает ровно одну петлю по 1/30 с и шлёт кадры jpeg на приёмник
// (f000.jpg…, в конце done.txt). Для невидимого Chrome: в нём ничто не притормаживает.
// ЗАМЕР РЫВКОВ (?jerk=<метка>, вместе с autocap): после разгона одна петля без картинки — наибольшее и среднее
// ускорение наклона стеблей каждой грядки; на приёмник J-<метка>.json.
if (params.has('jerk') && params.has('autocap') && VID_T) (async () => {
  await Promise.all(veilWait); await new Promise(r => setTimeout(r, 2000));
  window.requestAnimationFrame = () => 0;
  const H = window.__holst, url = params.get('autocap'), T0 = Math.ceil((clock + 20) / VID_T) * VID_T;
  while (clock < T0 - 0.05) H.sim(Math.min(0.5, T0 - 0.04 - clock));
  const beds = { эхинацея: window.__ehin, вербена: window.__verb, пион: window.__peony }, R = {};
  for (const n in beds) if (beds[n]) { const S = beds[n].dbg().S.filter(s => s.live); R[n] = { S, h: S.map(() => []) }; }
  for (let i = 0; i < VID_T * 60; i++) { H.sim(1 / 60 - 1e-6); for (const n in R) R[n].S.forEach((s, j) => R[n].h[j].push([s.x, s.z])); }
  const out = {};
  for (const n in R) { let mx = 0, sum = 0, cnt = 0, big = 0; const all = [];
    R[n].h.forEach(h => { for (let t = 2; t < h.length; t++) { const a = Math.hypot(h[t][0] - 2 * h[t - 1][0] + h[t - 2][0], h[t][1] - 2 * h[t - 1][1] + h[t - 2][1]) * 3600; all.push(a); mx = Math.max(mx, a); sum += a; cnt++; } });
    all.sort((x, y) => x - y); out[n] = { макс: +mx.toFixed(2), среднее: +(sum / cnt).toFixed(3), p999: +all[Math.floor(all.length * 0.999)].toFixed(2) }; }
  await fetch(url + 'J-' + params.get('jerk') + '.json', { method: 'POST', body: 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(out)))) });
})();
else if (params.has('autocap') && VID_T) (async () => {
  await Promise.all(veilWait); await new Promise(r => setTimeout(r, 2000));
  window.requestAnimationFrame = () => 0;
  const H = window.__holst, c = renderer.domElement, url = params.get('autocap') || 'http://127.0.0.1:8799/';
  const N = Math.round(VID_T * 30), T0 = Math.ceil((clock + 20) / VID_T) * VID_T, q = +(params.get('capq') ?? 0.93);
  const send = (n, d) => fetch(url + n, { method: 'POST', body: d });
  while (clock < T0 - 0.05) H.sim(Math.min(0.5, T0 - 0.04 - clock));
  for (let k = 0; k < N; k++) {
    const n = Math.round((T0 + k / 30 - clock) * 60); H.sim(n > 0 ? n / 60 - 1e-6 : 0);
    await send('f' + String(k).padStart(3, '0') + '.jpg', c.toDataURL('image/jpeg', q));
  }
  await send('done.txt', 'data:text/plain;base64,' + btoa(String(N)));
})();
</script>
