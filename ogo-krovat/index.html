<!doctype html>
<html lang="ru">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кровать с мягким изголовьем</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@300&display=swap">
<style>
  /* В духе сайта ОГО: белый фон, Inter, тёмно-серые кнопки 5 px, светло-серые поля. Один экран телефона:
     сверху 3D (виды и шаги сборки — поверх него), снизу панель: ткань и масло точками, размер, три кнопки.
     Цвет выбранного — как у их кнопки «Смотреть все» (её снимок 25 окт).
     На широком экране — 3D слева, панель справа. Одна светлая тема, как у них на сайте. */
  :root {
    --bg: #ffffff;
    --fg: #2c2c2c;
    --muted: #777777;
    --line: #dddddd;
    --field: #f8f8f8;
    --ink: #312f30;
    --ink-fg: #ffffff;
    --stage: #ffffff;
    --font: "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-logo: "Oswald", "Arial Narrow", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 300; font-size: 14px; line-height: 1.4;
         display: flex; flex-direction: column; overflow: hidden; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { flex: none; display: flex; align-items: center; gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); }
  .logo { font-family: var(--font-logo); font-weight: 300; font-size: 26px; line-height: 1; letter-spacing: 0.02em; color: #000; }
  h1 { margin: 0; font-size: 14px; font-weight: 400; color: var(--fg); }
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; background: var(--stage); touch-action: none; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  /* поверх 3D */
  .over { position: absolute; left: 0; right: 0; display: flex; gap: 6px; padding: 8px max(10px, env(safe-area-inset-left, 0px));
          pointer-events: none; overflow-x: auto; scrollbar-width: none; }
  .over > * { pointer-events: auto; }
  .over.top { top: 0; align-items: flex-start; justify-content: space-between; }
  .over.bot { bottom: 0; justify-content: center; }
  .pill { font: inherit; font-size: 12px; font-weight: 400; border: 1px solid rgba(0,0,0,.08); border-radius: 5px; background: rgba(255,255,255,.88);
          color: var(--fg); padding: 6px 10px; cursor: pointer; white-space: nowrap; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
  #steps .pill { min-width: 36px; }
  #stepText { margin: 0; font-size: 12px; font-weight: 400; color: var(--fg); background: rgba(255,255,255,.88); border-radius: 5px; padding: 6px 10px;
              max-width: 30ch; pointer-events: none; transition: opacity .4s; }
  #stepText.fade { opacity: 0; }
  #ar { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
  #ar img { width: 14px; height: 14px; }
  #toast { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); max-width: calc(100% - 32px); font-size: 12px; font-weight: 400;
           background: var(--ink); color: var(--ink-fg); border-radius: 5px; padding: 8px 12px; pointer-events: none; text-align: center; }
  body.asm #views { display: none; }
  body:not(.asm) #steps { display: none; }
  /* панель */
  .panel { flex: none; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px)); background: var(--bg); }
  .lab { font-size: 12px; color: var(--muted); }
  .pick { display: flex; justify-content: space-between; align-items: end; gap: 10px; }
  .grp { display: grid; gap: 6px; }
  .grp.r { justify-items: end; }
  /* точки с цветом (её просьба 25 окт, вечер: «не яблочки, а точки… минималистично»);
     выбранная — тонкое кольцо цвета кнопок, чтобы не путаться */
  .sw { display: flex; gap: 4px; }
  .sw button { width: 36px; height: 36px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .sw i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
          background: center / cover no-repeat; transition: box-shadow .15s; }
  .sw button[aria-pressed="true"] i { box-shadow: inset 0 0 0 1px rgba(0,0,0,.1), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
  /* размеры — ровно посередине, подпись — сбоку, не главная (её просьба 25 окт, вечер: «всё симметрично») */
  .mid { position: relative; display: flex; justify-content: center; align-items: center; }
  .mid .lab { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 5px; background: var(--field); overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--fg); padding: 6px 9px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); font-weight: 400; }
  #chosen { font-size: 12px; color: var(--muted); min-height: 1.4em; text-align: center; transition: opacity .4s; }
  #chosen.hint { color: var(--fg); }
  #chosen.fade { opacity: 0; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .acts button { font: inherit; font-size: 13px; font-weight: 600; height: 44px; border-radius: 5px; border: 1px solid var(--ink);
                 background: var(--bg); color: var(--fg); cursor: pointer; padding: 0 6px; }
  .acts button.main { background: var(--ink); color: var(--ink-fg); }
  .acts .mini { display: inline-block; width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px; border-radius: 50%;
                background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .acts button[aria-pressed="true"] { background: var(--field); }
  .acts button[disabled] { opacity: .6; cursor: progress; }
  /* «Скачать 3D ▾» — список форматов, как их выбор размера на сайте (Лида, 25 окт); сам список — родной, телефонный */
  .dlwrap { position: relative; display: grid; place-items: center; height: 44px; border-radius: 5px; font-size: 13px; font-weight: 600;
            background: var(--ink); color: var(--ink-fg); cursor: pointer; white-space: nowrap; }
  .dlwrap select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
  .dlwrap.busy { opacity: .6; cursor: progress; }
  .dlwrap:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (min-width: 860px) {
    body { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; }
    header { grid-column: 1 / -1; }
    #stage { min-height: 0; }
    .panel { align-content: start; padding-top: 24px; border-left: 1px solid var(--line); overflow-y: auto; }
  }
  @media (prefers-reduced-motion: reduce) { #stepText, #chosen, .sw i { transition: none; } }
</style>

<header class="gut">
  <span class="logo" aria-label="ОГО">ОГО</span>
  <h1>Кровать с мягким изголовьем</h1>
</header>

<div id="stage">
  <div id="loading">Загружаю кровать…</div>
  <div class="over top">
    <p id="stepText">Крутить — одним пальцем, приближать — двумя.</p>
    <a id="ar" class="pill" rel="ar" href="#" hidden><img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c2c2c' stroke-width='2'%3E%3Cpath d='M12 2l9 5v10l-9 5-9-5V7z'/%3E%3Cpath d='M3 7l9 5 9-5M12 12v10'/%3E%3C/svg%3E">В комнату</a>
  </div>
  <div class="over bot" id="views">
    <button type="button" class="pill" data-view="q" aria-pressed="true">Общий</button>
    <button type="button" class="pill" data-view="front" aria-pressed="false">Спереди</button>
    <button type="button" class="pill" data-view="side" aria-pressed="false">Сбоку</button>
    <button type="button" class="pill" data-view="top" aria-pressed="false">Сверху</button>
  </div>
  <div class="over bot" id="steps"></div>
  <div id="toast" hidden></div>
</div>

<section class="panel gut" aria-label="Выбор">
  <div class="pick">
    <div class="grp"><span class="lab">Ткань</span><div class="sw" id="fabric"></div></div>
    <div class="grp r"><span class="lab">Масло</span><div class="sw" id="wood"></div></div>
  </div>
  <div class="mid">
    <span class="lab">Матрас, см</span>
    <div class="seg" id="size" role="group" aria-label="Матрас"></div>
  </div>
  <div id="chosen" class="hint">Выберите цвет ткани и масла</div>
  <div class="acts">
    <button type="button" id="resetBtn"><span class="mini" aria-hidden="true"></span>Без цвета</button>
    <button type="button" id="asmBtn" aria-pressed="false">Сборка</button>
    <label class="dlwrap" id="dlwrap">Скачать 3D&nbsp;▾
      <select id="dl" aria-label="Скачать 3D-модель">
        <option value="" selected disabled hidden>Скачать 3D-модель</option>
        <option value="fbx">FBX</option>
        <option value="glb">GLB</option>
        <option value="obj">OBJ</option>
        <option value="zip">Все форматы (ZIP)</option>
      </select>
    </label>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';

// ── выбор
// масла и ткани — отметки Лиды 25 окт (самые популярные); только классическая, матрасы 140–200
// dot — цвет точки: средний цвет дерева с этим маслом (картинка дуба на странице)
// tint — поправка цвета дерева под свет сцены, у каждого масла своя: подогнано к фото их кроватей (25 окт, ночь:
// светлый дуб был ярче и желтее фото, тёмный — холоднее и серее); у Smoke фото кровати нет — как было
const WOODS = [
// swatch — цвет точки на панели: как дерево выглядит на кровати (замерено на освещённой боковине, 25 окт)
  { id: 'oak', name: 'Oak', dot: '#C29B5D', swatch: '#C29D73', tint: [1.05, 0.95, 0.8], sat: 0.72 },        // медовый, как ткань-на-кровати/1
  { id: 'smoke5', name: 'Smoke 5\u00a0%', dot: '#C29D65', swatch: '#C4A887', tint: [1.05, 0.97, 0.86], sat: 0.6 }, // чуть серее дуба — по образцу
  { id: 'chocolate', name: 'Chocolate', dot: '#5A463B', swatch: '#67503F', tint: [1.1, 0.97, 0.74], sat: 1 },   // глубже и теплее — фото 24 окт/12
];
const FABRICS = [   // цвет — с образца тканей, свет фото выровнен по белому фону
  { id: 'light', name: 'Светлая серо-бежевая', hex: '#DDCCB2' },   // чуть теплее — по фото кровати с этой тканью (25 окт)
  { id: 'taupe', name: 'Серо-коричневая', hex: '#7A6E68' },
];
const SIZES = { h: [140, 160, 180, 200] };   // 140 и 200 — её просьба 25 окт, вечер; цены на странице нет
// масло и ткань не выбраны — кровать белая; выбрали — окрашивается (её просьба 25 окт)
const state = { head: 'h', size: 180, wood: null, fabric: null };

// ── сцена
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.6;
controls.maxDistance = 12;

// свет мягче и теплее: солнце слабее, рассеянный — теплее и сильнее; тени на кровати мягче, всё «сочетается,
// ничего не режет глаз» (её слова 25 окт, ночь; было: солнце 1,55, рассеянный белый 1,0)
scene.add(new THREE.HemisphereLight(0xfff6ec, 0xc8b8a4, 1.2));
const sun = new THREE.DirectionalLight(0xfff6ea, 1.3);
const hemi = scene.children.find(o => o.isHemisphereLight);
sun.position.set(2.2, 5.5, -4.2);           // свет со стороны смотрящего, сверху — её выбор 25 окт (вариант 3: «потеплее, объём»)
sun.target.position.set(0, 0, -1.05);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.8, right: 2.8, top: 2.8, bottom: -2.8, near: 0.5, far: 14 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.01;
scene.add(sun);
scene.add(sun.target);
// тень на полу: снимок кровати снизу — где над полом есть кровать, там тень, ровная по всей кровати;
// к краям только рассеивается (её слова 25 окт: «между 2 и 3», «не утемняй тень по краю… должна рассеиваться»).
// Пятно заливает прорези фанеры и рассеивается по краю (blur), а сами прорези — почти резко и бледно (holes):
// её просьба «как 5, но не так сильно рассеивай, чтобы чуть-чуть видны дырки от фанеры». Деталь выше near даёт тень слабее, выше far — никакой:
// в сборке тень густеет плавно, пока деталь опускается (было — вспыхивала). Поле тени — с запасом, чтобы детали,
// приезжающие сзади и со стороны ног, не въезжали в тень из-за края (тоже вспышка). Солнце — только тени на кровати.
const SH = { size: 4.8, near: 0.42, far: 1.3, fill: 0.9, blur: 1.8, detail: 0.3, holes: 0.45, opacity: 0.17 };
const shadowGroup = new THREE.Group();
shadowGroup.position.set(0, 0.001, -1.2);           // от +1,2 (за изголовьем) до −3,6 м (за ногами)
scene.add(shadowGroup);
const RT = (samples = 0) => { const t = new THREE.WebGLRenderTarget(768, 768, { samples }); t.texture.generateMipmaps = false; return t; };   // ≈6 мм на точку
// снимок снизу — со сглаживанием: иначе тонкие детали в движении «дрожат» по точкам и тень мерцает
const rt = { raw: RT(4), tmp: RT(), det: RT(), fill: RT(), soft: RT(), out: RT() };
const shGeo = new THREE.PlaneGeometry(SH.size, SH.size).rotateX(Math.PI / 2);
const shPlane = new THREE.Mesh(shGeo, new THREE.MeshBasicMaterial({ map: rt.out.texture, transparent: true, opacity: SH.opacity, depthWrite: false }));
shPlane.renderOrder = 1;
shPlane.scale.y = -1;
shadowGroup.add(shPlane);
const blurPlane = new THREE.Mesh(shGeo);
blurPlane.visible = false;
shadowGroup.add(blurPlane);
const shCam = new THREE.OrthographicCamera(-SH.size / 2, SH.size / 2, SH.size / 2, -SH.size / 2, 0, SH.far);
shCam.rotation.x = Math.PI / 2;
shadowGroup.add(shCam);
const depthMat = new THREE.MeshDepthMaterial();             // всё, что ниже SH.near, — одинаково тёмное
depthMat.onBeforeCompile = sh => {
  sh.fragmentShader = sh.fragmentShader.replace('gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );',
    `gl_FragColor = vec4( 0.0, 0.0, 0.0, 1.0 - smoothstep( ${(SH.near / SH.far).toFixed(3)}, 1.0, fragCoordZ ) );`);
};
depthMat.depthTest = depthMat.depthWrite = false;
depthMat.blending = THREE.CustomBlending;                  // из нескольких деталей над точкой — самая низкая
depthMat.blendEquation = THREE.MaxEquation;
const hBlur = new THREE.ShaderMaterial(HorizontalBlurShader), vBlur = new THREE.ShaderMaterial(VerticalBlurShader);
const VS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }';
const solid = new THREE.ShaderMaterial({                     // порог: прорези залиты — сплошь, край плавный
  uniforms: { tDiffuse: { value: null } }, vertexShader: VS,
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main() { gl_FragColor = vec4( 0.0, 0.0, 0.0, smoothstep( 0.0, 0.8, texture2D( tDiffuse, vUv ).a ) ); }',
});
const compose = new THREE.ShaderMaterial({                   // мягкая тень, а где под фанерой прорезь — чуть светлее
  uniforms: { tA: { value: rt.soft.texture }, tF: { value: rt.fill.texture }, tB: { value: rt.det.texture }, k: { value: SH.holes } },
  vertexShader: VS,
  fragmentShader: 'uniform sampler2D tA, tF, tB; uniform float k; varying vec2 vUv; void main() { float a = texture2D( tA, vUv ).a, f = texture2D( tF, vUv ).a, b = texture2D( tB, vUv ).a; gl_FragColor = vec4( 0.0, 0.0, 0.0, a * ( 1.0 - k * f * ( 1.0 - b ) ) ); }',
});
[hBlur, vBlur, solid, compose].forEach(m => { m.depthTest = false; });
function pass(mat, dst) {
  blurPlane.material = mat;
  renderer.setRenderTarget(dst);
  renderer.render(blurPlane, shCam);
}
function blur(src, dst, amount) {
  amount *= 3.4 / SH.size;                          // размытие — в тех же сантиметрах, что подбирали на поле 3,4 м
  hBlur.uniforms.tDiffuse.value = src.texture;
  hBlur.uniforms.h.value = amount / 256;
  pass(hBlur, rt.tmp);
  vBlur.uniforms.tDiffuse.value = rt.tmp.texture;
  vBlur.uniforms.v.value = amount / 256;
  pass(vBlur, dst);
}
let shadowDirty = true;
function renderShadow() {
  shadowDirty = false;
  if (!bed) return;
  shPlane.visible = false;
  const auto = renderer.shadowMap.autoUpdate, ca = renderer.getClearAlpha();
  renderer.shadowMap.autoUpdate = false;
  scene.overrideMaterial = depthMat;
  renderer.setClearAlpha(0);
  renderer.setRenderTarget(rt.raw);
  renderer.clear();
  renderer.render(scene, shCam);                    // снизу: где над полом кровать
  scene.overrideMaterial = null;
  blurPlane.visible = true;
  blur(rt.raw, rt.det, SH.detail);                  // прорези — почти резко
  blur(rt.raw, rt.soft, SH.fill);                   // залить прорези…
  solid.uniforms.tDiffuse.value = rt.soft.texture;
  pass(solid, rt.fill);                             // …сплошное пятно с ровным краем
  blur(rt.fill, rt.soft, SH.blur);                  // край — рассеять
  blur(rt.soft, rt.soft, SH.blur * 0.5);
  compose.uniforms.k.value = SH.holes;
  pass(compose, rt.out);
  blurPlane.visible = false;
  renderer.setRenderTarget(null);
  renderer.setClearAlpha(ca);
  renderer.shadowMap.autoUpdate = auto;
  shPlane.visible = true;
}
function draw() {                                   // кадр: сначала тень, если кровать менялась
  if (shadowDirty) renderShadow();
  renderer.render(scene, camera);
}

// ── материалы
const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(url, rep = 1) {
  const t = loader.load(url, requestRender);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.flipY = false;
  t.repeat.set(rep, rep);
  t.anisotropy = maxAniso;
  return t;
}
const T = { wood: {}, light: tex('tex/wood-light.webp'), fabric: tex('tex/fabric.webp'), ply: tex('tex/ply.jpg') };   // ткань — из её фото, плитка 400 мм
// дуб: своя картинка на каждое масло (из фото). Сначала маленькая (60 КБ, видна сразу), потом полная —
// только у выбранного масла; маленькие остальных подгружаются заранее, чтобы смена масла была мгновенной
function woodTex(id) {
  const rec = T.wood[id] || (T.wood[id] = { best: null, small: false, full: false });
  const load = kind => {
    rec[kind] = 'loading';
    const x = loader.load(`tex/wood-${id}${kind === 'small' ? '-s' : ''}.webp`, () => {
      if (kind === 'full' || !rec.best) rec.best = x;          // полная важнее маленькой
      rec[kind] = true;
      if (state.wood === id) applyWood();
    });
    x.colorSpace = THREE.SRGBColorSpace;
    x.wrapS = x.wrapT = THREE.RepeatWrapping;
    x.flipY = false;
    x.anisotropy = maxAniso;
  };
  if (!rec.small) load('small');
  if (state.wood === id && !rec.full) load('full');

}
// бруски под фанерой: серая карта волокон × цвет
function grainMaterial(hex, k, rough) {
  const m = new THREE.MeshStandardMaterial({ map: T.light, color: hex, roughness: rough, envMapIntensity: 0.55 });
  m.userData.k = { value: k };
  m.onBeforeCompile = sh => {
    sh.uniforms.uK = m.userData.k;
    sh.fragmentShader = 'uniform float uK;\n' + sh.fragmentShader.replace('#include <map_fragment>',
      `#ifdef USE_MAP
        vec4 sampledDiffuseColor = texture2D( map, vMapUv );
        sampledDiffuseColor.rgb = mix( vec3( 1.0 ), sampledDiffuseColor.rgb, uK );
        diffuseColor *= sampledDiffuseColor;
      #endif`);
  };
  return m;
}
// «белая, пока не выбрали»: у материала uWhite — 1 белый, 0 свой цвет; переход — «окрашивание»
const WHITE_LIN = 1.0;   // её «чуть более светлым… побелее», 25 окт, вечер (было 0,9)
function paintable(m, key) {
  m.userData.white = { value: 1 };
  const prev = m.onBeforeCompile;
  m.onBeforeCompile = (sh, r) => {
    if (prev) prev(sh, r);
    sh.uniforms.uWhite = m.userData.white;
    sh.fragmentShader = 'uniform float uWhite;\n' + sh.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>
      diffuseColor.rgb = mix( diffuseColor.rgb, vec3( ${WHITE_LIN.toFixed(2)} ), uWhite );`);
  };
  m.customProgramCacheKey = () => 'paint-' + key;      // у каждого материала своя программа: общая путала «белизну»
  return m;
}
const MAT = {
  // масло Rubio — матовое, блика почти нет. Рельефа пор нет: при приближении от него «дрожало» (25 окт).
  // Цвет > 1 — поправка на свет сцены: вблизи дерево того же тона, что на её фото ножки (25 окт)
  // масло — мягкий шёлковый блеск (было 0,62 / 0,45 — сухо, «как пластик»)
  wood: new THREE.MeshStandardMaterial({ color: new THREE.Color(1.3, 1.24, 1.05), roughness: 0.45, envMapIntensity: 0.75 }),
  light: grainMaterial('#D8B48C', 1, 0.6),
  fabric: new THREE.MeshPhysicalMaterial({ map: T.fabric, roughness: 0.92, sheen: 0.45, sheenRoughness: 0.7, sheenColor: new THREE.Color('#ffffff'), envMapIntensity: 0.8 }),
  plyA: new THREE.MeshStandardMaterial({ map: T.ply, color: '#D6B888', roughness: 0.72, envMapIntensity: 0.45 }),
  plyB: new THREE.MeshStandardMaterial({ map: T.ply, color: '#E2CDA3', roughness: 0.72, envMapIntensity: 0.45 }),
  // торцы и стенки прорезей фанеры — тёплые, как свет в прорезях на их фото; не белеют и не красятся
  // (её просьба 25 окт: «на прорезях такое свечение… нежное, тёплое»); чуть светятся, чтобы и в тени были тёплыми
  plyEdge: new THREE.MeshStandardMaterial({ color: '#F1D6BC', roughness: 0.85, envMapIntensity: 0.5 }),
  metal: new THREE.MeshStandardMaterial({ color: '#9A9A96', metalness: 1, roughness: 0.35 }),
  nut: new THREE.MeshStandardMaterial({ color: '#9A9A96', metalness: 1, roughness: 0.35, emissive: '#000000' }),
  dark: new THREE.MeshStandardMaterial({ color: '#1A1410', roughness: 0.9 }),
};
// мягкость дерева: рисунок волокна чуть притушить к среднему цвету масла (soft 0…1) — пробуем её «уютнее,
// как на фото» (25 окт, ночь); средний цвет масла — как у точки
MAT.wood.userData.soft = { value: 0.35 };                  // её «уютнее, как на фото Лиды» (25 окт, ночь)
MAT.wood.userData.avg = { value: new THREE.Color('#C29B5D') };
MAT.wood.userData.sat = { value: 1 };                       // насыщенность — у каждого масла своя (WOODS.sat)
MAT.wood.onBeforeCompile = sh => {
  sh.uniforms.uSoft = MAT.wood.userData.soft;
  sh.uniforms.uAvg = MAT.wood.userData.avg;
  sh.uniforms.uSat = MAT.wood.userData.sat;
  sh.fragmentShader = 'uniform float uSoft;\nuniform float uSat;\nuniform vec3 uAvg;\n' + sh.fragmentShader.replace('#include <map_fragment>',
    `#include <map_fragment>
    diffuseColor.rgb = mix( diffuseColor.rgb, diffuse * uAvg, uSoft );
    diffuseColor.rgb = mix( vec3( dot( diffuseColor.rgb, vec3( 0.2126, 0.7152, 0.0722 ) ) ), diffuseColor.rgb, uSat );`);
};
// прорези фанеры — как на их фото: у верхнего края светлый тёплый отсвет, глубже — мягкая тёплая тень
// (её «более рассеянное освещение, воздушное… сейчас грубовато», 25 окт, ночь); высота — мировая, фанера на 0,332…0,350 м
MAT.plyEdge.onBeforeCompile = sh => {
  sh.vertexShader = 'varying float vWy;\n' + sh.vertexShader.replace('#include <worldpos_vertex>',
    '#include <worldpos_vertex>\n vWy = ( modelMatrix * vec4( transformed, 1.0 ) ).y;');
  sh.fragmentShader = 'varying float vWy;\n' + sh.fragmentShader.replace('#include <color_fragment>',
    `#include <color_fragment>
    diffuseColor.rgb *= mix( vec3( 0.42, 0.33, 0.26 ), vec3( 1.0 ), smoothstep( 0.336, 0.3495, vWy ) );`);
};
['wood', 'light', 'fabric', 'plyA', 'plyB', 'dark'].forEach(k => paintable(MAT[k], k));
const WOOD_MATS = [MAT.wood, MAT.light, MAT.dark];   // окрашиваются с маслом; фанера — нет, остаётся белой (её просьба 25 окт)
const painted = { wood: false, fabric: false };
function paint(mats, to = 0) {                          // белое ↔ свой цвет за 0,7 с (to: 0 — цвет, 1 — белое)
  const t0 = performance.now(), from = mats.map(m => m.userData.white.value);
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 700;
  const tick = now => {
    const u = Math.min(1, (now - t0) / dur), e = u * u * (3 - 2 * u);
    mats.forEach((m, i) => { m.userData.white.value = from[i] + (to - from[i]) * e; });
    draw();
    if (u < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function materialFor(mesh) {
  const n = mesh.name, m = mesh.material.name;
  if (m === 'Дерево') return MAT.wood;
  if (m === 'Брусок_светлый') return MAT.light;
  if (m === 'Ткань') return MAT.fabric;
  if (m === 'Фанера') return /малый/.test(n) ? MAT.plyB : MAT.plyA;
  if (m === 'Фанера_торец') return MAT.plyEdge;
  if (m === 'Металл') return /^Гайка/.test(n) ? MAT.nut : MAT.metal;   // мигают на шагах только гайки боковин и изножья
  if (m === 'Тень') return MAT.dark;
  return mesh.material;
}
function applyWood() {
  if (!state.wood) return;
  const wd = WOODS.find(x => x.id === state.wood);
  MAT.wood.userData.avg.value.set(wd.dot);
  MAT.wood.color.setRGB(...wd.tint);
  MAT.wood.userData.sat.value = wd.sat;
  const rec = woodTex(state.wood);
  if (!rec.best) return;                                 // картинка ещё грузится — покрасим, когда придёт
  if (MAT.wood.map !== rec.best) {
    const fresh = !MAT.wood.map;
    MAT.wood.map = rec.best;
    if (fresh) MAT.wood.needsUpdate = true;
  }
  if (!painted.wood) { painted.wood = true; paint(WOOD_MATS); }
  requestRender();
  if (typeof scheduleAR === 'function') scheduleAR();
}
function applyFabric() {
  if (!state.fabric) return;
  const f = FABRICS.find(x => x.id === state.fabric);
  MAT.fabric.map = T.fabric;
  MAT.fabric.color.set(f.hex);
  if (!painted.fabric) { painted.fabric = true; paint([MAT.fabric]); }
  requestRender();
  if (typeof scheduleAR === 'function') scheduleAR();
}

// ── модели
const gltfLoader = new GLTFLoader();
const cache = new Map();
let bed = null, parts = [];
const loading = document.getElementById('loading');
function key() { return state.head + state.size; }
function loadBed() {
  const k = key();
  loading.hidden = false;
  const done = g => {
    if (k !== key()) return;
    if (bed) scene.remove(bed);
    bed = g;
    scene.add(bed);
    parts = [];
    bed.traverse(o => {
      if (!o.isMesh) return;
      o.material = materialFor(o);
      o.castShadow = o.receiveShadow = true;
      if (!o.userData.home) {
        o.userData.home = o.position.clone();
        const b = new THREE.Box3().setFromObject(o);
        o.userData.cx = (b.min.x + b.max.x) / 2;
        o.userData.cz = (b.min.z + b.max.z) / 2;
      }
      o.visible = true;
      o.position.copy(o.userData.home);
      parts.push(o);
    });
    loading.hidden = true;
    stepAll();
    scheduleAR();
    if (!camSet) { view('q'); camSet = true; say('Крутить — одним пальцем, приближать — двумя.', 9000); }
    requestRender();
  };
  if (cache.has(k)) return done(cache.get(k));
  const fail = () => { loading.textContent = 'Модель не загрузилась. Обновите страницу.'; };
  fetch(`models/${k}.json`).then(r => r.json())
    .then(j => gltfLoader.parse(b64(j.glb), '', g => { cache.set(k, g.scene); done(g.scene); }, fail))
    .catch(fail);
}
function b64(s) {
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
let camSet = false;

// ── камера (метры; изголовье у z = 0, ноги у z = −длина)
function dims() { return DIMS ? DIMS[key()] : null; }
function view(kind) {
  const d = dims(), L = d ? d['длина'] / 1000 : 2.1;
  const c = new THREE.Vector3(0, 0.45, -L / 2);
  const P = {
    q: [[2.18, 1.46, -3.98], [0.2, 0.42, -1.05]],      // как на фото 07 (на телефоне широкая сдвинута, см. ниже)
    front: [[0, 1.25, -L - 3.4], [0, 0.5, -L / 2 + 0.2]],
    side: [[4.2, 1.15, -L / 2], [0, 0.45, -L / 2]],
    top: [[0, 6.2, -L / 2 - 0.001], [0, 0, -L / 2]],   // изголовье — вверху экрана (её просьба 25 окт, вечер)
  }[kind];
  const pos = new THREE.Vector3(...P[0]), tgt = new THREE.Vector3(...P[1]);
  const aspect = camera.aspect || 1;
  // камера одна для всех размеров — по самой широкой (200): середина изголовья стоит на месте, кровать растёт
  // от неё в стороны, ничего не прыгает (её просьба 25 окт, ночь)
  const W = 2.11;
  if (kind === 'q' && aspect < 1.3) { const dx = Math.max(0, W - 1.71) * 0.9; pos.x -= dx; tgt.x -= dx; }   // −x — влево на экране
  // на телефоне — дальше, чтобы влезла вся кровать (виды с ног, сбоку, сверху — не так далеко, как «как на фото»)
  // широкая кровать (180, 200) на узком экране — ещё дальше, чтобы не обрезалась справа
  const kw = aspect < 1.3 ? Math.max(1, (W + 0.7) / 2.3) : 1;
  const s = (aspect < 1 ? (kind === 'q' ? Math.min(2.5, 1.4 / aspect) : Math.min(1.5, 1.15 / aspect)) : 1.15) * kw;
  camera.position.copy(pos.sub(tgt).multiplyScalar(s).add(tgt));
  controls.target.copy(tgt);
  controls.update();
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === kind)));
  requestRender();
}
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => view(b.dataset.view)));

// ── отрисовка по запросу (телефон не греется)
let pending = false, anim = null;
function requestRender() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; draw(); });
}
controls.addEventListener('change', requestRender);
if (location.hash === '#dbg') window.dbg = { THREE, scene, camera, controls, requestRender, state, MAT, T, view, SH, sun, shPlane, renderer, rt, hemi,
  shadow: () => { shadowDirty = true; requestRender(); } };   // проверочные кадры

// ── сборка по шагам — порядок как в видео сборки ОГО (её кадры 25 окт, вечер): сначала изголовье,
// к нему основание; боковины надеваются на болты ножек со стороны ног, гайки — в гнёздах изнутри
const STEPS = {
  h: [
    { t: 'Изголовье: из ножек торчат болты и шпонки.', re: /^(Изголовье|Брусок_царги)/, from: [0, 0.15, 0.9] },
    { t: 'Основание: поперечина с ножками и три бруса — к изголовью.', re: /^(Поперечина|Ножка_брусок|Брус_вдоль)/, from: [0, 0.6, 0] },
    { t: 'Боковины — на болты ножек изголовья, гайки — в гнёздах изнутри.', re: /^(Боковина|Брусок_боковины|Гайка_М8)/, from: [0, 0.03, -0.7], pulse: /^Гайка_М8_(лев|прав)/ },
    { t: 'Изножье — на шпильки в боковинах.', re: /^(П_изножье|Брусок_изножье|Гайка_М6)/, from: [0, 0, -1.0], pulse: /^Гайка_М6_(лев|прав)/ },
    { t: 'Фанера — четыре листа.', re: /^Фанера/, from: [0, 0.5, 0], stagger: true },
  ],
};
const stepsBox = document.getElementById('steps');
const stepText = document.getElementById('stepText');
let curStep = -1;
function buildStepButtons() {
  stepsBox.querySelectorAll('button').forEach(b => b.remove());
  const S = STEPS[state.head];
  S.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pill'; b.textContent = String(i + 1); b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', `Шаг ${i + 1}: ${s.t}`);   // текст шага — только для чтения с экрана, на 3D его нет
    b.addEventListener('click', () => step(i));
    stepsBox.append(b);
  });
}
// подсказка поверх 3D: показать текст; hide — спрятать через несколько секунд
let hintTimer = null;
function say(text, hide = 0) {
  clearTimeout(hintTimer);
  stepText.textContent = text;
  stepText.classList.remove('fade');
  if (hide) hintTimer = setTimeout(() => stepText.classList.add('fade'), hide);
}
const asmBtn = document.getElementById('asmBtn');
asmBtn.addEventListener('click', () => {
  const on = !document.body.classList.contains('asm');
  document.body.classList.toggle('asm', on);
  asmBtn.setAttribute('aria-pressed', String(on));
  asmBtn.textContent = on ? 'Готово' : 'Сборка';
  if (on) step(0);
  else { stepAll(); scheduleAR(); }
});
function firstStep(o) {
  const S = STEPS[state.head];
  for (let i = 0; i < S.length; i++) if (S[i].re && S[i].re.test(o.name)) return i;
  return 0;
}
function offsetAt(o, k, S) {          // где деталь в конце шага k (null — ещё нет)
  const f = firstStep(o);
  if (f > k) return null;
  if (S[f].hold && k < f + 1) return new THREE.Vector3(...S[f].hold);
  return new THREE.Vector3();
}
function startAt(o, k, S) {
  const f = firstStep(o);
  if (f === k) {
    const fr = S[k].from;
    if (fr === 'side') return new THREE.Vector3(Math.sign(o.userData.cx) * 0.75, 0.05, 0);
    if (fr === 'end') return new THREE.Vector3(0, 0.05, o.userData.cz < -1 ? -0.8 : 0.8);
    return new THREE.Vector3(...fr);
  }
  return offsetAt(o, k - 1, S) ?? new THREE.Vector3();
}
function setButtons(k) {
  stepsBox.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === k)));
}
function step(k) {
  const S = STEPS[state.head];
  curStep = k;
  setButtons(k);
  stepText.classList.add('fade');                 // без подписей шагов — у ОГО есть инструкция (её просьба 25 окт, ночь)
  const tasks = [];
  parts.forEach(o => {
    const end = offsetAt(o, k, S);
    if (!end) { o.visible = false; return; }
    o.visible = true;
    const start = startAt(o, k, S);
    const order = /^Фанера_(\d)/.exec(o.name);
    tasks.push({ o, start, end, delay: S[k].stagger && order ? (order[1] - 1) * 0.28 : 0 });
  });

}
function stepAll() {
  curStep = -1;
  cancelAnimationFrame(anim);
  parts.forEach(o => { o.visible = true; o.position.copy(o.userData.home); });
  MAT.nut.emissive.set('#000000');
  setButtons(-1);
  shadowDirty = true;
  requestRender();
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(tasks, pulse) {
  cancelAnimationFrame(anim);

  const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const frame = now => {
    const sec = (now - t0) / 1000;
    let busy = false;
    tasks.forEach(({ o, start, end, delay }) => {
      const u = Math.min(1, Math.max(0, (sec - delay) * 1000 / dur));
      if (u < 1) busy = true;
      o.position.copy(o.userData.home).add(start.clone().lerp(end, ease(u)));
    });
    if (pulse) {
      const p = Math.max(0, Math.sin(sec * 6)) * (sec < 2.4 ? 1 : 0);
      MAT.nut.emissive.setRGB(0.9 * p, 0.45 * p, 0.05 * p);
      if (sec < 2.5) busy = true;
    } else MAT.nut.emissive.set('#000000');
    shadowDirty = true;
    draw();
    if (busy) anim = requestAnimationFrame(frame);
  };
  if (window.dbg) window.dbg.frameAt = sec => frame(t0 + sec * 1000);   // проверка: кадр шага в момент sec
  anim = requestAnimationFrame(frame);
}

// ── кнопки выбора
function swatch(box, list, kindKey, chipFor, onPick) {
  box.innerHTML = '';
  list.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(state[kindKey] === it.id));
    b.setAttribute('aria-label', it.name);
    b.title = it.name;
    const dot = document.createElement('i');
    dot.style.cssText = chipFor(it);
    b.append(dot);
    b.addEventListener('click', () => { dropHint(); state[kindKey] = it.id; box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); onPick(); update(); });
    box.append(b);
  });
}
// точки: масло — средний цвет дерева, ткань — цвет образца
swatch(document.getElementById('wood'), WOODS, 'wood', w => `background-color:${w.swatch}`, applyWood);
swatch(document.getElementById('fabric'), FABRICS, 'fabric', f => `background-color:${f.hex}`, applyFabric);

function buildSizes() {
  const box = document.getElementById('size');
  box.innerHTML = '';
  SIZES[state.head].forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(s);
    b.setAttribute('aria-label', `${s} × 200`);
    b.setAttribute('aria-pressed', String(state.size === s));
    b.addEventListener('click', () => {
      if (document.body.classList.contains('asm')) document.getElementById('asmBtn').click();   // сборка — заново, с целой кровати
      state.size = s; buildSizes(); loadBed(); update();
    });
    box.append(b);
  });
}

// подсказка «Выберите цвет ткани и масла» — пока человек не тронул страницу (её просьба 25 окт, вечер);
// дальше в этой строке — только названия выбранного
const chosen = document.getElementById('chosen');

  if (!hintOn) return;

  chosen.classList.add('fade');
  setTimeout(() => { chosen.classList.remove('hint'); update(); }, 400);
}
['pointerdown', 'keydown', 'wheel'].forEach(t => addEventListener(t, dropHint, { once: true, passive: true }));
function update() {

  const w = WOODS.find(x => x.id === state.wood), f = FABRICS.find(x => x.id === state.fabric);
  chosen.textContent = [f && 'Ткань ' + f.name.toLowerCase(), w && 'масло Rubio ' + w.name].filter(Boolean).join(' · ');
  chosen.classList.toggle('fade', !w && !f);
  scheduleAR();
}

// ── «в комнату»: на айфоне страница сама собирает файл .usdz из того, что выбрано
const arOK = document.createElement('a').relList.supports('ar');
const arLink = document.getElementById('ar');
let arURL = null, arTimer = null, arBusy = false;
function scheduleAR() {
  if (!arOK) return;
  if (!state.wood || !state.fabric) { arLink.hidden = true; return; }   // «в комнату» — уже окрашенную
  clearTimeout(arTimer);
  arLink.hidden = true;
  arTimer = setTimeout(makeAR, 1500);
}
async function makeAR() {
  if (!bed || curStep !== -1 || arBusy) { if (arOK) arTimer = setTimeout(makeAR, 1500); return; }
  arBusy = true;
  try {
    const data = await withPlainWood(async () => {
      const r = new USDZExporter().parse(bed, { quickLookCompatible: true, maxTextureSize: 1024 });
      return r instanceof Promise ? await r : r;
    });
    if (arURL) URL.revokeObjectURL(arURL);
    arURL = URL.createObjectURL(new Blob([data], { type: 'model/vnd.usdz+zip' }));
    arLink.href = arURL;
    arLink.hidden = false;
  } catch (e) {
    arLink.hidden = true;
  }
  arBusy = false;
}

// поправка цвета дерева (1,3) — только для света этой сцены; в файлы — картинка как есть
async function withPlainWood(fn) {
  const keep = MAT.wood.color.clone();
  MAT.wood.color.setRGB(1, 1, 1);
  try { return await fn(); } finally { MAT.wood.color.copy(keep); }
}

// ── скачать 3D-модель — списком форматов (её и Лиды решение 25 окт, ночь: «не архив… скачать в таком-то
// формате отдельно… и последняя — всё в ZIP»; «один файлик FBX, в котором всё сидит»). FBX и GLB — один файл,
// картинки внутри; OBJ — только архивом (картинки у OBJ всегда рядом). Масло не выбрано — дерево, бруски и фанера
// белые; ткань не выбрана — ткань белая («дать на сохранение белую кровать»).
const dlSel = document.getElementById('dl'), dlWrap = document.getElementById('dlwrap'), toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(text, hide = 4500) {
  clearTimeout(toastTimer);
  toastEl.textContent = text;
  toastEl.hidden = !text;
  if (text && hide) toastTimer = setTimeout(() => { toastEl.hidden = true; }, hide);
}
const LATIN = { oak: 'Oak', smoke5: 'Smoke5', chocolate: 'Chocolate', light: 'svetlaya', taupe: 'sero-korichnevaya' };
function srgbToLin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }
function linToSrgb(c) { return 255 * (c <= 0.0031308 ? c * 12.92 : 1.055 * c ** (1 / 2.4) - 0.055); }
async function fabricJpeg(hex) {             // серая ткань × цвет выбранной ткани (как на странице)
  const img = T.fabric.image;
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d');
  g.drawImage(img, 0, 0);
  const px = g.getImageData(0, 0, cv.width, cv.height);
  const c = [1, 3, 5].map(i => srgbToLin(parseInt(hex.slice(i, i + 2), 16)));
  const lut = new Float32Array(256).map((_, v) => srgbToLin(v));
  for (let i = 0; i < px.data.length; i += 4)
    for (let k = 0; k < 3; k++) px.data[i + k] = linToSrgb(lut[px.data[i + k]] * c[k]);
  g.putImageData(px, 0, 0);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
}
function whiteJpeg() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 8;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, 8, 8);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
}
const blobOf = url => fetch(url).then(r => r.blob());
async function textures() {                  // картинки под выбор (имена — как в .fbx и .mtl)
  const w = WOODS.find(x => x.id === state.wood), f = FABRICS.find(x => x.id === state.fabric);
  const white = (!w || !f) ? await whiteJpeg() : null;
  return {
    'wood.jpg': w ? await blobOf(`tex/wood-${w.id}.jpg`) : white,
    'plywood.jpg': w ? await blobOf('download/plywood.jpg') : white,
    'bars.jpg': w ? await blobOf('download/bars.jpg') : white,
    'fabric.jpg': f ? await fabricJpeg(f.hex) : white,
  };
}

// FBX (двоичный 7400, как пишет Blender): заменить встроенные картинки Objects/Video/Content. Тот же порядок
// действий, что `веб/проверка-fbx.py` — сверено: без замен файл собирается байт в байт, с заменами хеш тот же.
function fbxSwap(buf, imgs) {                // buf, imgs[имя] — Uint8Array; → массив кусков для Blob
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength), u32 = o => dv.getUint32(o, true);
  const dec = new TextDecoder(), zero13 = new Uint8Array(13);
  const parse = (o, end) => {                // → [узлы, смещение после списка, была ли пустая запись в конце]
    const nodes = [];
    while (o < end) {
      const eo = u32(o), n = u32(o + 4), pl = u32(o + 8);
      if (eo === 0) return [nodes, o + 13, true];
      const nl = buf[o + 12], ps = o + 13 + nl;
      let kids = [], sent = false;
      if (ps + pl < eo) [kids, , sent] = parse(ps + pl, eo);
      nodes.push({ name: buf.subarray(o + 13, ps), n, props: buf.subarray(ps, ps + pl), kids, sent });
      o = eo;
    }
    return [nodes, o, false];
  };
  const ver = u32(23);
  if (dec.decode(buf.subarray(0, 18)) !== 'Kaydara FBX Binary' || ver >= 7500) throw new Error('не тот FBX');
  const [top, fo] = parse(27, buf.length);
  const objs = top.find(nd => dec.decode(nd.name) === 'Objects');
  for (const v of objs.kids.filter(nd => dec.decode(nd.name) === 'Video')) {
    const rel = v.kids.find(nd => ['RelativeFilename', 'Filename'].includes(dec.decode(nd.name)));
    const key = dec.decode(rel.props.subarray(5)).replace(/\\/g, '/').split('/').pop();
    if (!imgs[key]) continue;
    const c = v.kids.find(nd => dec.decode(nd.name) === 'Content');
    const p = new Uint8Array(5 + imgs[key].length);
    p[0] = 82;                                // 'R' — сырые байты
    new DataView(p.buffer).setUint32(1, imgs[key].length, true);
    p.set(imgs[key], 5);
    c.n = 1;
    c.props = p;
  }
  const size = nd => 13 + nd.name.length + nd.props.length + nd.kids.reduce((s, k) => s + size(k), 0) + (nd.sent ? 13 : 0);
  const out = [buf.subarray(0, 27)];
  let off = 27;
  const head = (eo, n, pl, nl) => { const h = new Uint8Array(13), d = new DataView(h.buffer);
    d.setUint32(0, eo, true); d.setUint32(4, n, true); d.setUint32(8, pl, true); h[12] = nl; return h; };
  const write = nodes => {
    for (const nd of nodes) {
      const eo = off + size(nd);
      out.push(head(eo, nd.n, nd.props.length, nd.name.length), nd.name, nd.props);
      off += 13 + nd.name.length + nd.props.length;
      write(nd.kids);
      if (nd.sent) { out.push(zero13); off += 13; }
    }
  };
  write(top);
  out.push(zero13, buf.subarray(fo, fo + 16), new Uint8Array(4));
  off += 13 + 16 + 4;
  const pad = (((off + 15) & ~15) - off) || 16;
  const tail = new Uint8Array(pad + 4 + 120 + 16), td = new DataView(tail.buffer);
  td.setUint32(pad, ver, true);
  tail.set([0xf8, 0x5a, 0x8c, 0x6a, 0xde, 0xf5, 0xd9, 0x7e, 0xec, 0xe9, 0x0c, 0xe3, 0x75, 0x8f, 0x29, 0x0b], pad + 124);
  out.push(tail);
  return out;
}
const b64bytes = s => new Uint8Array(b64(s));
async function fbxFile(j, tex) {
  const imgs = {};
  for (const [k, b] of Object.entries(tex)) imgs[k] = new Uint8Array(await b.arrayBuffer());
  return new Blob(fbxSwap(b64bytes(j.fbx), imgs), { type: 'application/octet-stream' });
}
// GLB — из этой сцены; что не выбрано — белым
async function glb() {
  [T.fabric, T.ply, T.light, MAT.wood.map].forEach(t => { if (t) t.userData.mimeType = 'image/jpeg'; });
  const white = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.8, name: 'white' });
  const whiten = new Set([...(state.wood ? [] : [MAT.wood, MAT.light, MAT.plyA, MAT.plyB, MAT.dark]), ...(state.fabric ? [] : [MAT.fabric])]);
  const keep = [];
  bed.traverse(o => { if (o.isMesh && whiten.has(o.material)) { keep.push([o, o.material]); o.material = white; } });
  try {
    return await withPlainWood(() => new Promise((ok, bad) =>
      new GLTFExporter().parse(bed, ok, bad, { binary: true, maxTextureSize: 4096 })));
  } finally { keep.forEach(([o, m]) => { o.material = m; }); }
}
function readme(d, wood, fab) {
  return [
    'Кровать с мягким изголовьем — мастерская ОГО, Минск (o-go.by)',
    `Матрас ${state.size * 10} × 2000 мм; кровать ${d ? `${d['ширина']} × ${d['длина']} × ${d['высота']}` : ''} мм`,
    `Дуб, ${wood}; ткань изголовья — ${fab}`,
    '',
    'bed.fbx — один файл, картинки внутри: 3ds Max, Cinema 4D, ArchiCAD, Revit (как импорт)',
    'bed.glb — один файл, картинки внутри: Blender, SketchUp с расширением, сайты',
    'bed.obj + bed.mtl — почти любая программа; ось Y вверх, как принято для OBJ',
    'wood.jpg, fabric.jpg, plywood.jpg, bars.jpg — картинки для bed.obj, он берёт их по имени из этой папки',
    '',
    'Натуральная величина, единицы — метры. Начало координат — на полу, по центру ширины,',
    'у задней плоскости изголовья. Одна деталь кровати — один объект.',
  ].join('\r\n');
}
async function saveFile(blob, filename) {
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (dl) {
    try { await dl.save({ filename, data: blob }); return 'Готово: файл сохранён.'; }
    catch (e) { return e && e.code === 'declined' ? '' : 'Скачивание здесь недоступно — откройте страницу на сайте ОГО.'; }
  }
  if (window.claude) return 'Скачивание здесь недоступно — откройте страницу на сайте ОГО.';
  const a = document.createElement('a');           // обычный сайт: обычная ссылка
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return 'Готово: файл скачивается.';
}
async function makeFile(kind) {                     // kind: fbx | glb | obj | zip
  if (curStep !== -1) stepAll();                    // в файл — кровать целиком, на своих местах
  const w = WOODS.find(x => x.id === state.wood), f = FABRICS.find(x => x.id === state.fabric);
  const name = `OGO-krovat-${state.size}-` + (!w && !f ? 'belaya' : `${w ? LATIN[w.id] : 'belyj-dub'}-${f ? LATIN[f.id] : 'belaya-tkan'}`);
  if (kind === 'glb') return { name: name + '.glb', blob: new Blob([await glb()], { type: 'model/gltf-binary' }) };
  const j = await fetch(`download/h${state.size}.json`).then(r => r.json());
  const tex = await textures();
  if (kind === 'fbx') return { name: name + '.fbx', blob: await fbxFile(j, tex) };
  const zip = new JSZip(), dir = zip.folder(name);
  dir.file('bed.obj', j.obj, { base64: true });
  dir.file('bed.mtl', j.mtl);
  for (const [k, b] of Object.entries(tex)) dir.file(k, b);
  if (kind === 'zip') {
    dir.file('bed.fbx', await fbxFile(j, tex));
    dir.file('bed.glb', await glb());
  }
  dir.file('README.txt', readme(dims(), w ? 'масло Rubio Monocoat ' + w.name : 'белый (без масла)', f ? f.name.toLowerCase() : 'белая'));
  return { name: name + '.zip', blob: await zip.generateAsync({ type: 'blob' }) };
}
const KIND_TEXT = { fbx: 'FBX', glb: 'GLB', obj: 'OBJ', zip: 'все форматы' };   // без «один файл» — дизайнеры знают сами (её слова)
dlSel.addEventListener('change', async () => {
  const kind = dlSel.value;
  dlSel.value = '';
  if (!kind || !bed || typeof JSZip === 'undefined') return;
  dlSel.disabled = true;
  dlWrap.classList.add('busy');
  toast(`Собираю ${KIND_TEXT[kind]}: размер ${state.size}, ` + (state.wood || state.fabric ? 'выбранные масло и ткань…' : 'белая кровать…'), 0);
  try {
    const { name, blob } = await makeFile(kind);
    toast(await saveFile(blob, name));
  } catch (e) {
    toast('Файл не собрался. Обновите страницу и попробуйте ещё раз.');
  }
  dlSel.disabled = false;
  dlWrap.classList.remove('busy');
});
if (location.hash === '#dbg') Object.assign(window.dbg, { makeFile, fbxSwap, textures });

// ── «В интерьер»: фото своей комнаты — фоном, кровать поверх; повернуть, подвинуть, приблизить
document.getElementById('resetBtn').addEventListener('click', () => {   // снова белая
  state.wood = state.fabric = null;
  painted.wood = painted.fabric = false;

});
controls.addEventListener('start', () => { if (curStep === -1) stepText.classList.add('fade'); });

// ── старт
let DIMS = null;
fetch('dims.json').then(r => r.json()).then(j => { DIMS = j; update(); if (bed) view('q'); }).catch(() => {});
buildSizes();
buildStepButtons();
applyWood();
applyFabric();
update();

loadBed();
